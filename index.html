<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그라운드 룰</title>
<script src="config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 한 화면에 주제 하나. 가운데 열(최대 800px) + 위쪽 진행 막대 + 아래 고정 이동 막대. 마지막에 결과물 탭 */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --ink:#15203B; --ink2:#4B5672; --ink3:#8A93A8; --line:#DCE1EB;
  --accent:#2B4BDB; --accent-ink:#1D36A8; --accent-soft:#E8ECFC; --on-accent:#FFFFFF;
  --talk:#FFF8E5; --talk-line:#F0DCA4; --talk-ink:#6B4E00;
  --warn:#9A5B00; --warn-soft:#FFF1D6; --good:#1F7A52; --good-soft:#E6F4EC; --bad:#B23B2A; --bad-soft:#FBE9E6;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1322; --surface:#171E31; --ink:#E9EDF7; --ink2:#AEB7CC; --ink3:#7C869E; --line:#2A3450;
  --accent:#7D95FF; --accent-ink:#A9B9FF; --accent-soft:#1F2A50; --on-accent:#0E1322;
  --talk:#2A2414; --talk-line:#5A4A1E; --talk-ink:#F2D896;
  --warn:#F2B860; --warn-soft:#3A2A10; --good:#6FD3A0; --good-soft:#15302A; --bad:#FF8E7A; --bad-soft:#3A1A16; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#171E31; --ink:#E9EDF7; --ink2:#AEB7CC; --ink3:#7C869E; --line:#2A3450;
  --accent:#7D95FF; --accent-ink:#A9B9FF; --accent-soft:#1F2A50; --on-accent:#0E1322;
  --talk:#2A2414; --talk-line:#5A4A1E; --talk-ink:#F2D896;
  --warn:#F2B860; --warn-soft:#3A2A10; --good:#6FD3A0; --good-soft:#15302A; --bad:#FF8E7A; --bad-soft:#3A1A16; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;word-break:keep-all}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top-in{max-width:800px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap;border:0;background:none;padding:0}
.brand span{font-weight:500;color:var(--ink3);margin-left:6px;font-size:14px}
.prog{flex:1;min-width:180px;display:flex;align-items:center;gap:10px}
.prog .bars{flex:1;display:flex;gap:4px}
.prog .bars i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.prog .bars i.on{background:var(--accent)}
.prog small{font-size:13px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

.wrap{max-width:800px;margin:0 auto;padding-block:32px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:14px;font-weight:600;color:var(--accent-ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow .min{font-weight:500;color:var(--ink3)}
h1.q{font-size:clamp(26px,5vw,36px);line-height:1.25;letter-spacing:-.03em;margin:8px 0 10px;font-weight:700;text-wrap:balance}
.lead{font-size:17px;color:var(--ink2);margin:0 0 24px;max-width:62ch}
.sec-t{font-size:16px;font-weight:700;margin:30px 0 10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sec-t .cnt{font-size:14px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.sec-t .cnt.many{color:var(--warn)}

/* 시작 화면 */
.paths{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.path{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:6px}
.path:hover{border-color:var(--accent)}
.path .when{font-size:13px;font-weight:600;color:var(--ink3)}
.path b{font-size:21px;letter-spacing:-.02em}
.path .who{font-size:14.5px;color:var(--ink2)}
.path ul{margin:8px 0 0;padding-left:18px;font-size:15px;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.path .go{margin-top:12px;font-weight:700;color:var(--accent-ink)}

/* 소개 */
.agenda{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 20px;margin-bottom:18px}
.agenda ol{list-style:none;margin:0;padding:0}
.agenda li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:17px}
.agenda li:last-child{border-bottom:0}
.agenda li small{display:block;font-size:14px;color:var(--ink2)}
.agenda .t{color:var(--ink3);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.note{font-size:15px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:12px}
.note b{color:var(--ink)}

/* 입력 */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:15px;font-weight:600}
.fld .optl{font-weight:400;color:var(--ink3);font-size:13.5px}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;background:var(--surface);outline:0;width:100%}
.fld textarea{min-height:80px;resize:vertical;font-size:16px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent)}

/* 이야기 상자 */
.talk{background:var(--talk);border:1.5px solid var(--talk-line);border-radius:16px;padding:16px 20px;margin:0 0 8px}
.talk b{display:block;color:var(--talk-ink);font-size:15px;margin-bottom:6px}
.talk ol{margin:0;padding-left:20px;font-size:17px;display:flex;flex-direction:column;gap:4px}

/* 리더: 문장 카드 */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{position:relative;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 46px 14px 16px;display:flex;flex-direction:column;gap:3px;min-height:84px}
.opt:hover{border-color:var(--accent)}
.opt .k{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.opt .s{font-size:14px;color:var(--ink2);line-height:1.45}
.opt .ck{position:absolute;right:14px;top:14px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent)}
.opt[aria-pressed="true"] .ck::after{content:"";position:absolute;left:5px;top:6px;width:8px;height:4px;border-left:2.5px solid var(--on-accent);border-bottom:2.5px solid var(--on-accent);transform:rotate(-45deg)}
.many-note{grid-column:1/-1;font-size:14.5px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 14px}
.chosen{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:start;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 8px 10px 14px}
.it:focus-within{border-color:var(--accent)}
.it textarea{border:0;outline:0;background:transparent;resize:none;width:100%;font-size:16px;line-height:1.55;padding:4px 0;min-height:30px}
.it .why{grid-column:1;border:0;border-top:1px dashed var(--line);outline:0;background:transparent;font-size:15px;color:var(--ink2);padding:8px 0 2px;width:100%}
.it .addwhy{grid-column:1;justify-self:start;border:0;background:none;color:var(--accent-ink);font-size:14px;font-weight:600;padding:2px 0}
.it .x{grid-row:1;grid-column:2;border:0;background:transparent;color:var(--ink3);width:32px;height:30px;border-radius:8px;font-size:15px}
.it .x:hover{background:var(--warn-soft);color:var(--warn)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--ink3)}
.add{margin-top:8px;width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:12px;font-weight:600;color:var(--ink2)}
.add:hover{border-color:var(--accent);color:var(--accent-ink)}
.bal{border-radius:14px;padding:12px 16px;margin:0 0 6px;font-size:15.5px}
.bal.ok{background:var(--good-soft);color:var(--good)}
.bal.low{background:var(--warn-soft);color:var(--warn)}

/* 팀: 결정 질문 */
.dq{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:12px}
.dq.done{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.dqh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:10px}
.dqh b{font-size:17.5px;letter-spacing:-.01em}
.dqh .kind{font-size:13px;color:var(--ink3);white-space:nowrap}
.dq .help{font-size:14px;color:var(--ink2);margin:-4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:15.5px;font-weight:500;line-height:1.3}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip.other{border-style:dashed}
.oth{margin-top:10px;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:var(--surface);outline:0}
.oth:focus{border-color:var(--accent)}
.memo{margin-top:22px}

/* R&R 표 편집 */
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.quick .chip::before{content:"+ ";color:var(--accent-ink);font-weight:700}
.quick .chip:disabled{opacity:.4;cursor:default}
.quick .chip:disabled::before{content:"✓ "}
.rnr{display:flex;flex-direction:column;gap:8px}
.rr{display:grid;grid-template-columns:minmax(0,1.8fr) 96px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 34px;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 8px 8px 10px}
.rr.h{background:transparent;border:0;padding:0 8px 0 12px;font-size:13px;font-weight:600;color:var(--ink3)}
.rr input,.rr select{min-width:0;width:100%;border:1.5px solid transparent;border-radius:8px;padding:8px;font-size:15px;background:var(--bg);outline:0}
.rr input:focus,.rr select:focus{border-color:var(--accent)}
.rr .x{border:0;background:transparent;color:var(--ink3);width:32px;height:32px;border-radius:8px}
.rr .x:hover{background:var(--warn-soft);color:var(--warn)}

/* 아래 이동 막대 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-in{max-width:800px;margin:0 auto;display:flex;gap:10px;align-items:center}
.nav .sp{flex:1}
.nbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 18px;font-weight:600;font-size:16px}
.nbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.nbtn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.nbtn.ghost{border-color:transparent;color:var(--ink2)}

/* 완성 화면 */
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 16px;font-weight:600;color:var(--ink3)}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.sheet-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.scaler{position:relative;overflow:hidden}
.sheet{position:absolute;left:0;top:0;transform-origin:top left;width:210mm;height:297mm;padding:12mm;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(21,32,59,.12)}
.print-note{font-size:14px;color:var(--ink3);margin:10px 2px 0}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 26px}
.doc h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.doc .dmeta{color:var(--ink3);font-size:14px;margin-bottom:18px}
.doc h3{margin:22px 0 8px;font-size:16px;color:var(--accent-ink)}
.doc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.doc li small{display:block;color:var(--ink2);font-size:14px}
.doc .kv{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:6px 14px;font-size:15.5px}
.doc .kv dt{color:var(--ink2)}
.doc .kv dd{margin:0;font-weight:600}
.doc .memo-t{margin-top:8px;font-size:15px;color:var(--ink2);white-space:pre-wrap}
.tbl-wrap{overflow-x:auto}
.doc table{border-collapse:collapse;width:100%;font-size:15px;min-width:560px}
.doc th,.doc td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
.doc th{font-size:13px;color:var(--ink3);font-weight:600}

/* ---------- 인쇄물 (종이라서 테마와 관계없이 고정 색) ---------- */
.p{--pi:#15203B;--pi2:#4B5672;--pl:#DCE1EB;--pa:#2B4BDB;--pas:#E8ECFC;--py:#FFC845;
  width:186mm;height:272mm;overflow:hidden;font-family:var(--font);color:var(--pi);font-size:calc(11pt * var(--k,1));line-height:1.35;display:flex;flex-direction:column}
.p .meta{display:flex;justify-content:space-between;gap:1em;font-size:.74em;color:var(--pi2);font-weight:600}
.p h1{margin:.35em 0 0;font-size:2.5em;font-weight:700;letter-spacing:-.04em;line-height:1.15}
.p .intro{margin:.5em 0 0;font-size:1.02em;color:var(--pi2)}
.p .rule{height:.32em;background:var(--pi);margin:.9em 0 0}
.p .rows{display:flex;flex-direction:column;flex:1}
.p .r{display:grid;grid-template-columns:5.6em 1fr;gap:1em;padding:.85em .7em;border-bottom:1px solid var(--pl);flex:1;align-items:center}
.p .r .lab{font-size:1.08em;font-weight:700;color:var(--pa);line-height:1.25}
.p .cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8em 1.1em}
.p .cell{border-left:.18em solid var(--pas);padding-left:.7em;min-width:0}
.p .cell b{display:block;font-size:1.3em;font-weight:700;letter-spacing:-.03em;line-height:1.22}
.p .cell span{display:block;font-size:.76em;color:var(--pi2);margin-top:.2em}
.p .r.band{background:var(--pi);color:#fff;border:0;border-radius:.45em;margin-top:.7em;flex:.7}
.p .r.band .lab{color:var(--py)}
.p .r.band .cell{border-left-color:var(--py)}
.p .r.band .cell span{color:#C5CBE0}
.p .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:1em;padding-top:.8em;font-size:.82em;color:var(--pi2)}
.p .foot b{color:var(--pi);white-space:nowrap}
.p .ph{color:#B9C0CE}
.p table{border-collapse:collapse;width:100%;margin-top:1em;font-size:.95em}
.p th{text-align:left;font-size:.8em;color:var(--pi2);font-weight:600;border-bottom:.15em solid var(--pi);padding:.5em .5em}
.p td{border-bottom:1px solid var(--pl);padding:.6em .5em;vertical-align:top}
.p td.w{font-weight:700}


/* 전사 가이드라인 */
.guide{background:var(--talk);border:1.5px solid var(--talk-line);border-radius:14px;padding:12px 18px 13px;margin:0 0 18px}
.guide .gh{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;margin-bottom:4px}
.guide .gh b{color:var(--talk-ink);font-size:15px}
.guide .gh span{color:var(--ink2);font-size:13.5px}
.guide ul{margin:0;padding-left:20px;font-size:15.5px;display:flex;flex-direction:column;gap:2px}
/* 접는 블록 (선택 항목) */
.fold{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;margin-top:14px}
.fold > .fh{display:flex;gap:12px;align-items:center;padding:16px 18px}
.fold > .fh div{flex:1;min-width:0}
.fold > .fh b{display:block;font-size:17px}
.fold > .fh span{font-size:14px;color:var(--ink2)}
.fold > .fb{padding:0 18px 18px}
.fold.open{border-color:color-mix(in srgb, var(--accent) 40%, var(--line))}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--bg);color:var(--ink3);margin-left:6px;vertical-align:2px}
.fbtn{border:1.5px solid var(--accent);background:var(--surface);color:var(--accent-ink);border-radius:10px;padding:8px 14px;font-weight:600;white-space:nowrap}
.fbtn.quiet{border-color:var(--line);color:var(--ink3)}
/* 스타일 막대 */
.spec{display:flex;flex-direction:column;gap:14px}
.sr{display:grid;grid-template-columns:110px 1fr 110px;gap:12px;align-items:center;font-size:14.5px;color:var(--ink2)}
.sr .l{text-align:right}
.dots{display:flex;justify-content:space-between;position:relative}
.dots::before{content:"";position:absolute;left:12px;right:12px;top:50%;height:2px;background:var(--line)}
.dot{position:relative;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);padding:0}
.dot:hover{border-color:var(--accent)}
.dot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
/* 직접 쓴 문장의 벽보용 짧은 말 */
.it .kwin{grid-column:1;border:0;border-top:1px dashed var(--line);outline:0;background:transparent;font-size:15px;font-weight:600;padding:8px 0 2px;width:100%}
/* 간단한 표 (시차출퇴근 · 직접 추가 주제) */
.mini{display:flex;flex-direction:column;gap:8px}
.mr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 34px;gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:8px}
.mr.topic{grid-template-columns:minmax(0,1fr) 34px}
.mr input,.mr textarea{min-width:0;width:100%;border:1.5px solid transparent;border-radius:8px;padding:8px;font-size:15px;background:var(--surface);outline:0}
.mr textarea{grid-column:1;resize:vertical;min-height:60px}
.mr input:focus,.mr textarea:focus{border-color:var(--accent)}
.mr .x{border:0;background:transparent;color:var(--ink3);width:32px;height:32px;border-radius:8px}
.mr .x:hover{background:var(--warn-soft);color:var(--warn)}
.p .pspec{display:flex;flex-wrap:wrap;gap:.4em 1.6em;padding:.7em 0;border-bottom:1px solid var(--pl);font-size:.72em;color:var(--pi2)}
.p .pspec span{display:flex;align-items:center;gap:.5em;white-space:nowrap}
.p .pspec i{position:relative;display:inline-block;width:5.2em;height:.32em;background:#dfe3ec;border-radius:1em}
.p .pspec i::after{content:"";position:absolute;top:50%;left:var(--x);width:.85em;height:.85em;border-radius:50%;background:var(--pa);transform:translate(-50%,-50%)}
.p h2{font-size:1.25em;margin:1.4em 0 0}

/* 팀 미팅 타이머 */
.tmr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px}
.tmr .tl{font-size:13px;color:var(--ink2);white-space:nowrap}
.tmr b{font-size:20px;font-variant-numeric:tabular-nums;min-width:4.2ch;letter-spacing:-.01em}
.tmr.warn{background:var(--warn-soft);border-color:var(--warn)} .tmr.warn b{color:var(--warn)}
.tmr.over{background:#FBE3DF;border-color:#C2412D} .tmr.over b{color:#B23B2A}
.tb{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13.5px;font-weight:600;white-space:nowrap}
.tb.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tb[aria-pressed="false"]{color:var(--ink3)}
.tbanner{border-top:1px solid var(--line)}
.tbanner .tb-in{max-width:800px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:10px;font-size:15px}
.tbanner .tb-in span{flex:1;min-width:200px;color:var(--ink2)}
.tbanner.warn b{color:var(--warn)} .tbanner.over b{color:#C2412D}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tmr.over{background:#3A1A16} :root:not([data-theme="light"]) .tmr.over b, :root:not([data-theme="light"]) .tbanner.over b{color:#FF8E7A} }
:root[data-theme="dark"] .tmr.over{background:#3A1A16} :root[data-theme="dark"] .tmr.over b, :root[data-theme="dark"] .tbanner.over b{color:#FF8E7A}
@media (max-width:640px){
  .paths,.opts,.fgrid{grid-template-columns:1fr}
  .wrap{padding-block:22px 120px}
  .lead{font-size:16px}
  .nbtn{padding:12px 14px}
  .rr.h{display:none}
  .rr{grid-template-columns:1fr 1fr 34px}
  .mr{grid-template-columns:1fr 1fr 34px} .mr .c-n{grid-column:1/3} .mr .x{grid-column:3;grid-row:1}
  .sr{grid-template-columns:1fr 1fr;row-gap:6px} .sr .l{text-align:left;order:1} .sr .r{text-align:right;order:2} .sr .dots{grid-column:1/-1;order:3}
  .rr .c-task{grid-column:1/3} .rr .x{grid-column:3;grid-row:1}
  .doc{padding:18px}
  .doc .kv{grid-template-columns:1fr}
  .doc .kv dd{margin-bottom:6px}
}

html,body{margin:0}
img{max-width:100%}
/* ---------- 사이트: 로그인 · 계정 · 저장 · 작성 완료 ---------- */
[hidden]{display:none!important}
body[data-auth="out"] .top, body[data-auth="out"] .wrap, body[data-auth="out"] .nav,
body[data-auth="wait"] .top, body[data-auth="wait"] .wrap, body[data-auth="wait"] .nav{display:none!important}
body[data-auth="in"] .auth, body[data-auth="wait"] .auth{display:none!important}
body:not([data-auth="wait"]) #waitView{display:none}
.loading{min-height:70vh;display:grid;place-items:center;color:var(--ink3);font-size:16px}

.auth{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.acard{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 30px 26px}
.abrand{font-weight:700;font-size:15px;color:var(--ink2);margin-bottom:18px}
.abrand span{font-weight:500;color:var(--ink3);margin-left:8px}
.acard h1{margin:0 0 6px;font-size:28px;letter-spacing:-.03em;line-height:1.25}
.acard .asub{margin:0 0 20px;color:var(--ink2);font-size:15.5px}
.atabs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:18px}
.atabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px;font-size:15px;font-weight:600;color:var(--ink3)}
.atabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(21,32,59,.12)}
.acard .fld{margin-bottom:14px}
.acard .help{font-size:13px;color:var(--ink3)}
.amsg{border-radius:10px;padding:10px 13px;font-size:14.5px;margin-bottom:14px}
.amsg.bad{background:var(--bad-soft);color:var(--bad)} .amsg.ok{background:var(--good-soft);color:var(--good)}
.abtn{width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;background:var(--accent);color:var(--on-accent);margin-top:4px}
.abtn:hover:not(:disabled){background:var(--accent-ink)} .abtn:disabled{opacity:.6}
.afoot{margin:16px 0 0;font-size:13.5px;color:var(--ink3);text-align:center}

/* 머리줄 계정 */
.acct{position:relative;display:flex;align-items:center;gap:10px;margin-left:auto}
.saved{font-size:13px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.saved.bad{color:var(--bad);font-weight:600}
.acbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.amenu{position:absolute;right:0;top:calc(100% + 8px);z-index:20;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 12px 32px rgba(21,32,59,.16);display:flex;flex-direction:column}
.amenu .aem{font-size:13.5px;color:var(--ink3);padding:6px 10px 8px;border-bottom:1px solid var(--line);margin-bottom:4px;overflow-wrap:anywhere}
.amenu button{border:0;background:transparent;text-align:left;border-radius:8px;padding:9px 10px;font-size:15px;font-weight:500}
.amenu button:hover{background:var(--bg)}

/* 시작 화면의 진행 상태 */
.pst{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:1px}
.pst.s-none{background:var(--bg);color:var(--ink3)}
.pst.s-draft{background:var(--accent-soft);color:var(--accent-ink)}
.pst.s-done{background:var(--good-soft);color:var(--good)}
.pst.s-dirty{background:var(--warn-soft);color:var(--warn)}

/* 작성 완료 */
.subbox{border-radius:16px;padding:18px 20px;margin:0 0 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1.5px solid var(--line);background:var(--surface)}
.subbox .st{flex:1;min-width:220px}
.subbox .st b{display:block;font-size:18px;margin-bottom:2px}
.subbox .st span{font-size:15px;color:var(--ink2)}
.subbox.done{background:var(--good-soft);border-color:color-mix(in srgb, var(--good) 35%, transparent)}
.subbox.done .st b{color:var(--good)}
.subbox.dirty{background:var(--warn-soft);border-color:color-mix(in srgb, var(--warn) 35%, transparent)}
.subbox.dirty .st b{color:var(--warn)}
.sbtn{border:0;border-radius:12px;padding:13px 22px;font-size:17px;font-weight:700;background:var(--accent);color:var(--on-accent);white-space:nowrap}
.sbtn:hover:not(:disabled){background:var(--accent-ink)}
.sbtn:disabled{opacity:.55;cursor:default}
.miss{font-size:14.5px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 14px;margin:0 0 10px}
.miss button{border:0;background:transparent;color:var(--accent-ink);font-weight:700;padding:0;text-decoration:underline}
.err{font-size:14.5px;color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:10px 14px;margin:0 0 10px}
.tabrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tabrow .tabs{margin-bottom:0}
.tabrow .sp{flex:1}
.pbtn{border:1.5px solid var(--accent);background:var(--surface);color:var(--accent-ink);border-radius:12px;padding:10px 16px;font-weight:700;font-size:15px;white-space:nowrap}
.pbtn:hover{background:var(--accent-soft)}

/* 비밀번호 바꾸기 창 */
.modal{position:fixed;inset:0;z-index:30;background:rgba(14,19,34,.45);display:grid;place-items:center;padding:16px}
.mcard{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 24px 20px}
.mcard h2{margin:0 0 14px;font-size:21px;letter-spacing:-.02em}
.mcard .fld{margin-bottom:12px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}

@media (max-width:640px){
  .saved{display:none}
  .acard{padding:26px 20px 22px}
}

/* ---------- 인쇄 · PDF ---------- */
@page{size:A4;margin:0}
@media print{
  :root:not(#_print){--bg:#fff;--surface:#fff;--ink:#15203B;--ink2:#4B5672;--ink3:#8A93A8;--line:#DCE1EB;--accent:#2B4BDB;--accent-ink:#1D36A8;--accent-soft:#E8ECFC;--warn:#9A5B00;color-scheme:light}

  .tbl-wrap{overflow:visible}
  .doc table{min-width:0}

  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

async function http(path, opt){
  let r; try { r = await fetch(BASE + path, opt); } catch(e){ throw Object.assign(new Error("network"), {status:0}); }

}

  if(!sess) throw new Error("auth");

    try { setSess(await authPost("token?grant_type=refresh_token", {refresh_token: sess.refresh})); }

function fromData(d){
  const s = blank(); if(!d || typeof d!=="object") return s;
  const L = d.leader && typeof d.leader==="object" ? d.leader : {}, T = d.team && typeof d.team==="object" ? d.team : {};
  ["name","title","dept","intro"].forEach(k=>{ if(L.info && L.info[k]!=null) s.leader.info[k] = str(L.info[k]); });
  Object.keys(s.leader.picks).forEach(k=>{ const a = L.picks && L.picks[k]; if(Array.isArray(a)) s.leader.picks[k] = a.map(i=>({id:i.id||uid(), text:str(i.text), kw:str(i.kw), src:str(i.src), reason:str(i.reason)})); });
  if(L.spectrum && typeof L.spectrum==="object") Object.keys(L.spectrum).forEach(k=>{ const v = +L.spectrum[k]; if(v>=1 && v<=5) s.leader.spectrum[k] = v; });
  if(L.closing!==undefined) s.leader.closing = !!L.closing;
  ["name","date","people"].forEach(k=>{ if(T.info && T.info[k]!=null) s.team.info[k] = str(T.info[k]); });
  if(T.dec && typeof T.dec==="object") Object.keys(T.dec).forEach(id=>{ const x = T.dec[id]; if(x && typeof x==="object") s.team.dec[id] = {sel:Array.isArray(x.sel)?x.sel.map(Number).filter(n=>n>=0):[], other:str(x.other), otherOn:!!x.otherOn}; });
  if(T.memo && typeof T.memo==="object") Object.keys(T.memo).forEach(k=>{ s.team.memo[k] = str(T.memo[k]); });
  if(Array.isArray(T.rnr)) s.team.rnr = T.rnr.map(r=>({id:r.id||uid(), task:str(r.task), cycle:str(r.cycle)||"매월", due:str(r.due), owner:str(r.owner), sub:str(r.sub)}));
  if(Array.isArray(T.flex)) s.team.flex = T.flex.map(r=>({id:r.id||uid(), name:str(r.name), in:str(r.in), out:str(r.out)}));
  if(Array.isArray(T.topics)) s.team.topics = T.topics.map(t=>({id:t.id||uid(), title:str(t.title), note:str(t.note)}));
  if(T.extra!=null) s.team.extra = str(T.extra);
  if(T.review) s.team.review = str(T.review);
  return s;
}
function partEmpty(p){
  if(p==="leader"){ const L = S.leader; return !L.info.name.trim() && !Object.keys(PICKS).some(k=>filled(L.picks[k]).length); }
  const T = S.team; return !T.info.name.trim() && !Object.values(T.dec).some(d=>d.sel.length || str(d.other).trim()) && !T.rnr.length && !T.flex.length && !T.topics.length && !T.extra.trim();
}
let SUB = {leader:null, team:null};   // 부분별 마지막 작성 완료 {at, sig}
function partState(p){ const s = SUB[p]; if(!s) return partEmpty(p) ? "none" : "draft"; return s.sig === partSig(p) ? "done" : "dirty"; }
const STATE_LABEL = {none:"작성 전", draft:"작성 중", done:"작성 완료", dirty:"수정 후 미반영"};

/* ----- 자동 저장 ----- */
let lastSavedSig = "", saving = false, savePending = false, saveT = null, busy = false, lastErr = "", stepMem = {};
function setSaved(kind, text){ const el = $("#saved"); if(!el) return; el.className = "saved" + (kind==="bad" ? " bad" : ""); el.textContent = text; }
function uiSave(){
  if(!sess) return; if(S.flow) stepMem[S.flow] = S.step;
  try { localStorage.setItem(UI_KEY + "_" + sess.uid, JSON.stringify({flow:S.flow, step:S.step, mem:stepMem, lv:S.leader.view, tv:S.team.view, lo:S.leader.open, to:S.team.open, tleft:S.team.tleft, sound:S.team.sound})); } catch(e){}
}
function applyUI(){
  let u = {}; try { u = JSON.parse(localStorage.getItem(UI_KEY + "_" + sess.uid)||"{}") || {}; } catch(e){}
  stepMem = u.mem && typeof u.mem==="object" ? u.mem : {};
  if(u.flow==="leader" || u.flow==="team"){ S.flow = u.flow; S.step = Math.max(0, Math.min(FLOWS[u.flow].steps.length-1, +u.step||0)); }
  if(u.lv) S.leader.view = u.lv; if(u.tv) S.team.view = u.tv;
  if(u.lo && typeof u.lo==="object") S.leader.open = u.lo; if(u.to && typeof u.to==="object") S.team.open = u.to;
  if(u.tleft && typeof u.tleft==="object") S.team.tleft = u.tleft; if(u.sound!==undefined) S.team.sound = !!u.sound;
}
function persist(){
  if(PREVIEW_PART || !sess) return;
  uiSave(); drawSubBox();
  clearTimeout(saveT); saveT = setTimeout(saveServer, 1200);
}
async function saveServer(){
  if(!sess || PREVIEW_PART) return;
  if(saving){ savePending = true; return; }
  const s0 = fullSig(); if(s0 === lastSavedSig) return;
  saving = true; setSaved("", "저장 중…");
  try { await rpc("gr_save", {p_data: payload()}); lastSavedSig = s0; setSaved("", `저장됨 ${hhmm(new Date())}`); }
  catch(e){ if(e.message!=="auth") setSaved("bad", e.message==="network" ? "저장 실패 · 인터넷 연결 확인" : "저장 실패 · 담당자에게 알려주세요"); }
  saving = false;
  if(savePending || (sess && fullSig() !== lastSavedSig)){ savePending = false; clearTimeout(saveT); saveT = setTimeout(saveServer, 1500); }
}
window.addEventListener("beforeunload", e=>{ if(sess && !PREVIEW_PART && fullSig() !== lastSavedSig){ saveServer(); e.preventDefault(); e.returnValue = ""; } });

/* ----- 작성 완료 ----- */
function subBoxHtml(){
  const p = S.flow, st = partState(p), s = SUB[p];
  let miss = "";
  if(p==="leader"){ const m = ["report","meeting","comm","promise"].filter(k=>!filled(S.leader.picks[k]).length);
    if(m.length) miss = `<div class="miss">아직 비어 있는 단계: ${m.map(k=>`<button data-goto="${k}">${PICKS[k].label}</button>`).join(", ")} · 비워 둔 채로 완료해도 돼요.</div>`; }
  else { const n = [...stepByKey("commute").qs, ...stepByKey("leave").qs].filter(q=>!decText(q)).length;
    if(n) miss = `<div class="miss">출퇴근·연차에서 ${n}개를 아직 정하지 않았어요. 회의 정리에 ‘미정’으로 남아요.</div>`; }
  const [cls, title, sub, btn, dis] = !s ? ["", "다 정했으면 ‘작성 완료’를 눌러주세요", "누른 뒤에도 언제든 고칠 수 있어요.", "작성 완료", false]
    : st==="done" ? ["done", `작성 완료 · ${fmtTime(s.at)}`, "고치면 ‘수정 내용 반영하기’ 버튼이 다시 켜져요.", "완료됨", true]
    : ["dirty", "완료한 뒤에 고친 내용이 있어요", "‘수정 내용 반영하기’를 눌러야 완료본이 바뀌어요.", "수정 내용 반영하기", false];
  return `${lastErr?`<div class="err">${esc(lastErr)}</div>`:""}${miss}
    <div class="subbox ${cls}"><div class="st"><b>${title}</b><span>${sub}</span></div>
    <button class="sbtn" data-complete ${dis||busy?"disabled":""}>${busy?"저장하는 중…":btn}</button></div>`;
}
function drawSubBox(){ const b = document.getElementById("subbox"); if(b && S.flow) b.innerHTML = subBoxHtml(); }
async function complete(){
  if(busy || !sess || PREVIEW_PART) return;
  const p = S.flow; busy = true; lastErr = ""; drawSubBox(); clearTimeout(saveT);
  const pay = payload(), s0 = hash(JSON.stringify(pay));
  try { const r = await rpc("gr_submit_mine", {p_data: pay, p_part: p}); SUB[p] = {at:r.submitted_at, sig:hash(canon(pay[p]))}; lastSavedSig = s0; setSaved("", `저장됨 ${hhmm(new Date())}`); }
  catch(e){ if(e.message!=="auth") lastErr = errText(e.message); }
  busy = false; if(sess) drawSubBox();
}
function startFlow(k){
  navAuto = true; S.flow = k; const n = FLOWS[k].steps.length, st = partState(k);
  S.step = st==="done" || st==="dirty" ? n-1 : Math.max(0, Math.min(n-1, +stepMem[k]||0));
  save(); render(); window.scrollTo({top:0});
}

/* ----- 인쇄 ----- */
function curView(){ return (S.flow==="team" ? S.team : S.leader).view; }
function preparePrint(){
  if(!S.flow || ST().type!=="finish") return false;
  const v = curView(); document.body.dataset.print = v==="doc" ? "doc" : "sheet";
  if(v!=="doc") drawSheet(v);
  return true;
}
function doPrint(){
  if(!preparePrint()) return;
  const v = curView(), I = S.flow==="team" ? S.team.info : S.leader.info, name = (I.name||"").trim() || "작성본";
  const what = S.flow==="team" ? ({poster:"팀규칙_벽보", rnr:"RnR표", doc:"팀규칙_회의정리"})[v] : ({poster:"리더소개_벽보", doc:"리더소개_전체본"})[v];
  const old = document.title; document.title = `그라운드룰_${what}_${name}`;
  setTimeout(()=>{ window.print(); setTimeout(()=>{ document.title = old; }, 600); }, 60);
}
window.addEventListener("beforeprint", preparePrint);
window.addEventListener("afterprint", ()=>{ if(S.flow && ST().type==="finish" && curView()!=="doc") drawSheet(curView()); });

/* =================== 공통 조각 =================== */
const isOpen = (obj, id, has) => obj[id]===undefined ? !!has : !!obj[id];
function fold(id, open, title, desc, body, owner){
  return `<section class="fold ${open?"open":""}" id="fold-${id}"><div class="fh"><div><b>${title}<span class="tag">선택</span></b><span>${desc}</span></div>
    <button class="fbtn ${open?"quiet":""}" data-fold="${owner}|${id}">${open?"접기":"펼치기"}</button></div>${open?`<div class="fb">${body}</div>`:""}</section>`;
}
function pickBody(key){

      ${many?`<div class="many-note">${list.length}개를 골랐어요. 꼭 지킬 것 3개 이하로 줄이면 더 잘 기억돼요.</div>`:""}</div>
    <div class="sec-t"><span>내 말로 다듬고, 이유 붙이기</span></div>
    <div class="chosen">${list.length ? list.map(it=>`<div class="it">
        <textarea rows="1" data-it="${key}|${it.id}" aria-label="${P.label} 내용" placeholder="내용을 적어주세요">${esc(it.text)}</textarea>
        <button class="x" data-rm="${key}|${it.id}" aria-label="빼기">✕</button>
        ${!it.src ? `<input class="kwin" data-kw="${key}|${it.id}" value="${esc(it.kw)}" placeholder="벽보에 쓸 짧은 말 · 예) 30분 회의" aria-label="벽보에 쓸 짧은 말">` : ""}
        ${it.reason || it.why ? `<input class="why" data-why="${key}|${it.id}" value="${esc(it.reason)}" placeholder="이유 한 줄 · 예) 여러분의 시간을 아끼고 싶어서요" aria-label="이유">`
                              : `<button class="addwhy" data-addwhy="${key}|${it.id}">+ 이유 한 줄</button>`}

function qHtml(q){
  const d = decOf(q.id), val = decText(q);
  if(q.type==="text") return `<section class="dq ${val?"done":""}"><div class="dqh"><b>${q.q}</b><span class="kind">직접 쓰기</span></div>
    <input class="oth" style="margin-top:0" data-dtext="${q.id}" value="${esc(d.other)}" placeholder="${esc(q.help||"")}" aria-label="${esc(q.q)}"></section>`;
  return `<section class="dq ${val?"done":""}"><div class="dqh"><b>${q.q}</b><span class="kind">${q.type==="many"?"여러 개 선택":"하나 선택"}</span></div>
    ${q.help?`<p class="help">${q.help}</p>`:""}
    <div class="chips">${q.options.map((o,i)=>`<button class="chip" data-dec="${q.id}|${i}" aria-pressed="${d.sel.includes(i)}">${esc(o)}</button>`).join("")}
      <button class="chip other" data-doth="${q.id}" aria-pressed="${d.otherOn}">직접 입력</button></div>
    ${d.otherOn?`<input class="oth" data-dother="${q.id}" value="${esc(d.other)}" placeholder="우리 팀 방식을 짧게 적어주세요" aria-label="${esc(q.q)} 직접 입력">`:""}</section>`;
}
const talkBox = t => `<section class="talk" aria-label="이야기해 볼 질문"><b>먼저 이야기해 보세요</b><ol>${t.map(x=>`<li>${x}</li>`).join("")}</ol></section>`;

/* =================== 화면 =================== */
function render(){
  const m = $("#main");
  if(!S.flow){ renderHome(m); $("#prog").hidden = true; $("#nav").hidden = true; setupTimer(null); return; }
  const steps = F().steps, st = ST();
  $("#prog").hidden = false;
  $("#bars").innerHTML = steps.map((_,i)=>`<i class="${i<=S.step?"on":""}"></i>`).join("");
  $("#progTxt").textContent = `${F().name} · ${S.step+1} / ${steps.length}`;
  ({intro:renderIntro, info:renderInfo, pick:renderPick, lextra:renderLextra, decide:renderDecide, rnr:renderRnr, textra:renderTextra, finish:renderFinish})[st.type](m, st);
  renderNav(st);
  setupTimer(st);
  m.querySelectorAll("textarea").forEach(grow);
}

function renderPick(m, st){

const keep = fn => { const y = window.scrollY; fn(); save(); render(); window.scrollTo({top:y}); };

/* =================== 팀 미팅 타이머 =================== */
const TIMED = ["decide","rnr","textra"];
let TM = {key:null, running:false, end:0, left:0, warned:false, over:false}, tickId = null, actx = null, lastSave = 0;
const tkey = st => st.key || st.type;
const tfull = st => (st.min || 10) * 60;
const fmtT = sec => { const neg = sec < 0, a = Math.abs(Math.round(sec)), m = Math.floor(a/60), s = String(a%60).padStart(2,"0"); return (neg ? "+" : "") + m + ":" + s; };
function remain(){ return TM.running ? (TM.end - Date.now())/1000 : TM.left; }
let navAuto = false;   // 화면을 넘겨 들어오면 타이머 자동 시작
function setupTimer(st){
  const auto = navAuto; navAuto = false;
  const box = $("#tmr"), timed = S.flow==="team" && st && TIMED.includes(st.type);
  if(!timed){ if(TM.running) pauseT(); TM.key = null; box.hidden = true; hideBanner(); return; }
  const key = tkey(st);
  if(TM.key !== key){
    const was = TM.running; if(was) pauseT();
    const left = S.team.tleft[key] != null ? S.team.tleft[key] : tfull(st);
    TM = {key, running:false, end:0, left, warned:left<=60, over:left<=0};
    hideBanner();
    if(was || (auto && left > 0)) startT();
  }
  box.hidden = false; drawTimer(st);
}
function drawTimer(st){
  st = st || ST(); const r = remain(), cls = r <= 0 ? "over" : r <= 60 ? "warn" : "";
  $("#tmr").className = "tmr " + cls;
  $("#tmr").innerHTML = `<span class="tl">${st.label} · ${st.min}분</span><b id="tmrT" role="timer" aria-live="off">${r<0 ? fmtT(r)+" 초과" : fmtT(r)}</b>
    <button class="tb main" data-t="toggle">${TM.running ? "일시정지" : (r < tfull(st) ? "계속" : "시작")}</button>
    <button class="tb" data-t="add">+1분</button>
    <button class="tb" data-t="reset" aria-label="타이머 처음으로">처음으로</button>
    <button class="tb" data-t="sound" aria-pressed="${S.team.sound}" aria-label="알림음">${S.team.sound ? "소리 켬" : "소리 끔"}</button>`;
}
function startT(){
  TM.running = true; TM.end = Date.now() + TM.left*1000;
  try { if(!actx && S.team.sound){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); } if(actx && actx.state==="suspended") actx.resume(); } catch(e){}
  clearInterval(tickId); tickId = setInterval(tickT, 250); drawTimer();
}
function pauseT(){ TM.left = remain(); TM.running = false; clearInterval(tickId); if(TM.key){ S.team.tleft[TM.key] = TM.left; save(); } }
function tickT(){
  const r = remain(), el = $("#tmrT");
  if(el) el.textContent = r<0 ? fmtT(r)+" 초과" : fmtT(r);
  const cls = r <= 0 ? "over" : r <= 60 ? "warn" : "";
  if($("#tmr").className !== "tmr " + cls) $("#tmr").className = "tmr " + cls;
  if(Date.now() - lastSave > 3000){ S.team.tleft[TM.key] = r; save(); lastSave = Date.now(); }
  if(!TM.warned && r <= 60 && r > 0){ TM.warned = true; beep(2); showBanner("warn"); }
  if(!TM.over && r <= 0){ TM.over = true; beep(3); showBanner("over"); }
}
function beep(n){
  if(!S.team.sound || !actx) return;
  try { for(let i=0;i<n;i++){ const t = actx.currentTime + i*0.28, o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = 880; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+0.2);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.22); } } catch(e){}
}
let bannerT = null;
function showBanner(kind){
  const b = $("#tbanner"), last = S.step >= F().steps.length - 2;
  b.className = "tbanner " + kind; b.hidden = false;
  b.innerHTML = kind==="warn"
    ? `<div class="tb-in"><b>1분 남았어요.</b><span>정한 것을 한 번 읽어보고, 넘어갈 준비를 해주세요.</span><button class="tb" data-t="hide">닫기</button></div>`
    : `<div class="tb-in"><b>시간이 다 됐어요.</b><span>결론이 안 났다면 비워 두고 넘어가도 괜찮아요.</span><button class="tb" data-t="add">+1분</button><button class="tb main" data-t="next">${last ? "결과 보기" : "다음 주제로"}</button></div>`;
  clearTimeout(bannerT); if(kind==="warn") bannerT = setTimeout(hideBanner, 8000);
}
function hideBanner(){ const b = $("#tbanner"); if(b) b.hidden = true; }
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-t]"); if(!b) return;
  const a = b.dataset.t, st = ST();
  if(a==="toggle"){ TM.running ? pauseT() : startT(); drawTimer(); }
  if(a==="add"){ if(TM.running) TM.end += 60000; else TM.left += 60; const r = remain(); if(r > 60) TM.warned = false; if(r > 0) TM.over = false; hideBanner(); S.team.tleft[TM.key] = r; save(); drawTimer(); }
  if(a==="reset"){ const was = TM.running; pauseT(); TM.left = tfull(st); TM.warned = false; TM.over = false; S.team.tleft[TM.key] = TM.left; save(); hideBanner(); if(was) startT(); drawTimer(); }
  if(a==="sound"){ S.team.sound = !S.team.sound; save(); if(S.team.sound && !actx){ try { const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); } catch(err){} } drawTimer(); }
  if(a==="hide") hideBanner();

});

  const aw = c("[data-addwhy]"); if(aw){ const [k,id] = aw.dataset.addwhy.split("|"), it = S.leader.picks[k].find(x=>x.id===id); it.why = true; keep(()=>{}); const f = document.querySelector(`[data-why="${k}|${id}"]`); if(f) f.focus(); return; }
  const ad = c("[data-add]"); if(ad){ const it = {id:uid(), text:"", kw:"", src:"", reason:""}; S.leader.picks[ad.dataset.add].push(it); keep(()=>{}); const f = document.querySelector(`[data-it="${ad.dataset.add}|${it.id}"]`); if(f) f.focus(); return; }
  const dc = c("[data-dec]");

  const qk = c("[data-quick]"); if(qk && !qk.disabled){ keep(()=>{ S.team.rnr.push({id:uid(), task:qk.dataset.quick, cycle:"매월", due:"", owner:"", sub:"", room:""}); }); return; }

/* 로그인 화면 */
let amode = "login";
function showAuth(msg, kind){
  document.body.dataset.auth = "out";
  const m = $("#authMsg"); m.hidden = !msg; m.className = "amsg " + (kind||"bad"); m.textContent = msg||"";
  if(!apiReady()){ m.hidden = false; m.className = "amsg bad"; m.textContent = "아직 서버가 연결되지 않았어요. 담당자에게 알려주세요. (설정: config.js)"; $("#authBtn").disabled = true; }
}
function setAmode(mode){
  amode = mode;
  document.querySelectorAll("[data-amode]").forEach(b=>b.classList.toggle("on", b.dataset.amode===mode));
  const su = mode==="signup";
  $("#authTitle").textContent = su ? "처음 오셨나요?" : "로그인";
  $("#authSub").textContent = su ? "회사 이메일과 사용할 비밀번호를 정해주세요. 메일 인증 없이 바로 시작돼요." : "회사 이메일로 로그인하면 쓰는 내용이 자동으로 저장돼서, 어느 PC에서든 이어서 쓸 수 있어요.";
  $("#pw2Wrap").hidden = !su; $("#pwHelp").hidden = !su;
  $("#aPw").autocomplete = su ? "new-password" : "current-password";

  $("#authMsg").hidden = true;
}
document.querySelectorAll("[data-amode]").forEach(b=>b.addEventListener("click", ()=>setAmode(b.dataset.amode)));
$("#authForm").addEventListener("submit", async ev=>{
  ev.preventDefault();
  const email = $("#aEmail").value.trim().toLowerCase(), pw = $("#aPw").value, msg = t => showAuth(t);
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return msg("이메일 주소를 확인해 주세요.");
  if(amode==="signup"){
    if(DOMAIN && email.split("@")[1] !== DOMAIN) return msg(`회사 이메일(@${DOMAIN})로만 가입할 수 있어요.`);
    if(pw.length < 8) return msg("비밀번호는 8자 이상으로 정해주세요.");
    if(pw !== $("#aPw2").value) return msg("두 비밀번호가 달라요.");
  } else if(!pw) return msg("비밀번호를 입력해 주세요.");
  const b = $("#authBtn"); b.disabled = true; const label = b.textContent; b.textContent = "잠시만요…";
  try {
    if(amode==="signup"){
      const j = await authPost("signup", {email, password: pw});
      if(!j || !j.access_token){ b.disabled = false; b.textContent = label; return msg("가입은 됐지만 바로 로그인할 수 없어요. 담당자에게 알려주세요. (설정: Supabase의 'Confirm email' 끄기)"); }
      setSess(j);
    } else setSess(await authPost("token?grant_type=password", {email, password: pw}));
    $("#aPw").value = ""; $("#aPw2").value = "";
    await enterApp();
  } catch(e){
    const c = String(e.message||"") + " " + JSON.stringify(e.body||"");
    msg(e.message==="network" ? errText("network")
      : /domain_not_allowed|hook/i.test(c) ? `회사 이메일(@${DOMAIN||"회사 도메인"})로만 가입할 수 있어요.`
      : /already|exists|registered/i.test(c) ? "이미 가입한 이메일이에요. ‘로그인’ 탭에서 로그인해 주세요."
      : /weak|password/i.test(c) && amode==="signup" ? "비밀번호가 너무 쉬워요. 다른 비밀번호를 써주세요."
      : /invalid|credentials|grant/i.test(c) ? "이메일 또는 비밀번호가 맞지 않아요."
      : /not.?confirmed/i.test(c) ? "이메일 인증이 필요한 상태예요. 담당자에게 알려주세요. (설정: 'Confirm email' 끄기)"
      : `잠시 후 다시 해주세요. (오류: ${e.message})`);
  }
  b.disabled = false; b.textContent = label;
});

async function enterApp(){
  document.body.dataset.auth = "wait";
  try {
    const r = await rpc("gr_mine", {}) || {};
    try { GUIDES = (await rpc("gr_guides", {})) || {}; } catch(e){ GUIDES = {}; }
    S = fromData(r.data); applyUI();
    const sb = r.submitted && typeof r.submitted==="object" ? r.submitted : {};
    SUB = {leader:null, team:null};
    ["leader","team"].forEach(p=>{ const x = sb[p]; if(x && x.data) SUB[p] = {at:x.at, sig:hash(canon(x.data))}; });
    const has = r.data && r.data.v===4;
    lastSavedSig = has ? fullSig() : "";
    document.body.dataset.auth = "in";
    $("#acctEmail").textContent = sess.email;
    lastErr = ""; render();
    if(has && r.updated_at) setSaved("", `저장됨 ${hhmm(new Date(r.updated_at))}`); else setSaved("", "");
  } catch(e){
    if(e.message==="auth") return;
    signOut(errText(e.message));
  }
}

/* 관리자 미리보기 (?preview=leader|team, 읽기 전용) */
let PV = {label:"", who:""};
if(CFG.orgName){ $("#brandSub").textContent = CFG.orgName; $("#authOrg").textContent = CFG.orgName; }
if(DOMAIN) $("#aEmail").placeholder = "hong@" + DOMAIN;
if(PREVIEW_PART){
  let p = null; try { p = JSON.parse(localStorage.getItem("gr_admin_preview")||"null"); } catch(e){}
  S = fromData(p && p.data); S.flow = PREVIEW_PART; S.step = FLOWS[PREVIEW_PART].steps.length - 1;
  const view = p && p.view; if(view) (PREVIEW_PART==="team" ? S.team : S.leader).view = view;
  const I = PREVIEW_PART==="team" ? S.team.info : S.leader.info;
  PV = {label: (PREVIEW_PART==="team" ? "우리 팀 규칙" : "리더 소개") + " · " + ((p && p.which) || ""),
        who: PREVIEW_PART==="team" ? (I.name || "팀 이름 없음") + ((p && p.by) ? " · " + p.by : "") : ([I.name, I.title].filter(Boolean).join(" ") || "이름 없음")};
  document.body.dataset.auth = "in"; $("#acctBox").hidden = true; $(".brand").removeAttribute("data-home");
  $("#brandSub").textContent = "관리자 미리보기";
  document.title = "미리보기 · " + PV.who;
  render();
} else if(sess && apiReady()){
  enterApp();
} else {
  setAmode("login"); showAuth();
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if($("#poster")) drawSheet(curView()); });

</script>
</body>
</html>
