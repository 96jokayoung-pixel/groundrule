<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>그라운드 룰 관리자</title>
<script src="config.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#15203B; --ink2:#4B5672; --ink3:#8A93A8;
  --line:#DDE2EC; --bg:#F5F6F9; --paper:#FFFFFF;
  --cobalt:#2B4BDB; --cobalt-ink:#1D36A8; --cobalt-soft:#E9EDFC; --signal:#FFC845;
  --good:#1F7A52; --good-soft:#E6F4EC; --warn:#9A5B00; --warn-soft:#FFF1D6; --bad:#B23B2A; --bad-soft:#FBE9E6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;cursor:pointer;color:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
[hidden]{display:none!important}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lcard{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:30px 28px}
.lcard h1{margin:0 0 4px;font-size:24px;letter-spacing:-.03em}
.lcard p{margin:0 0 22px;color:var(--ink2);font-size:14.5px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:14px;font-weight:700}
.fld input{border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:16px;outline:0}
.fld input:focus{border-color:var(--cobalt)}
.pbtn{width:100%;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:800;background:var(--ink);color:#fff;margin-top:6px}
.pbtn:disabled{opacity:.6}
.msg{border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}

/* app */
.top{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 24px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.brand span{font-weight:500;color:var(--ink3);margin-left:8px;font-size:14px}
.sp{flex:1}
.who{font-size:13px;color:var(--ink3)}
.tbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 13px;font-size:14px;font-weight:600;white-space:nowrap}
.tbtn:hover{border-color:var(--ink3)}
.tbtn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:24px 24px 60px}
.head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:28px;letter-spacing:-.035em}
.head .sum{color:var(--ink2);font-size:15px;margin-top:2px}
.share{margin-left:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.share b{font-size:13px;white-space:nowrap}
.share input{border:0;background:#f4f5f8;border-radius:8px;padding:7px 9px;font-size:13px;color:var(--ink2);width:280px;min-width:0}
.share button{border:0;background:var(--cobalt);color:#fff;border-radius:8px;padding:7px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.tabs{display:flex;gap:2px;background:#e6e9ef;border-radius:10px;padding:3px;width:max-content;margin-bottom:16px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:700;color:var(--ink3)}
.tabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(21,32,59,.12)}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar input{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;width:260px;max-width:100%;outline:0;background:var(--paper)}
.bar input:focus{border-color:var(--cobalt)}
.bar .cnt{color:var(--ink3);font-size:14px}

/* table */
.tbl{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(170px,1.4fr) 112px 100px 100px 70px 104px minmax(270px,auto);gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row.h{border-top:0;background:#f8f9fb;font-size:13px;font-weight:700;color:var(--ink3);padding:10px 16px}
.row .nm b{display:block;font-size:16px}
.row .nm span{font-size:13px;color:var(--ink3)}
.row .t{font-size:14px;color:var(--ink2)}
.row .num{font-size:15px;font-weight:700}
.bd{display:inline-block;font-size:12.5px;font-weight:800;border-radius:6px;padding:2px 8px}
.bd.ok{background:var(--good-soft);color:var(--good)} .bd.low{background:var(--warn-soft);color:var(--warn)}
.st{display:inline-block;font-size:12.5px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st.s-done{background:var(--good-soft);color:var(--good)} .st.s-edit{background:var(--warn-soft);color:var(--warn)}
.st.s-draft{background:var(--cobalt-soft);color:var(--cobalt-ink)} .st.s-none{background:#ECEEF2;color:var(--ink3)}
.bar select{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;background:var(--paper)}
.row .nm .em{display:block;font-size:12.5px;color:var(--ink3)}
.acts button:disabled{opacity:.4;cursor:default}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acts button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
.acts button:hover{border-color:var(--ink3)}
.acts .del:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.more{border:0;background:transparent;color:var(--cobalt);font-weight:700;font-size:13px;padding:0;margin-top:2px}
.detail{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 22px;background:#f8f9fb;border-radius:10px;padding:14px 16px;margin-top:4px}
.detail h4{margin:0 0 4px;font-size:13px;color:var(--cobalt)}
.detail ul{margin:0;padding-left:18px;font-size:14px}
.detail li{margin:2px 0}
.detail .phil{grid-column:1/-1;font-size:14px;color:var(--ink2)}
.empty{background:var(--paper);border:1.5px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--ink2)}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.sc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px}
.sc h3{margin:0 0 2px;font-size:17px}
.sc .sub{font-size:13px;color:var(--ink3);margin-bottom:12px}
.sb{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px 10px;align-items:center;margin-bottom:9px}
.sb .lb{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .n{grid-row:span 2;text-align:right;font-weight:800;font-size:15px}
.sb .tr{height:7px;background:#eef0f5;border-radius:7px;overflow:hidden}
.sb .tr i{display:block;height:100%;background:var(--cobalt);border-radius:7px}
.sc .own{font-size:13px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}

.gform{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.gcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.gcard label{font-size:16px;font-weight:800}
.gcard .gsub{font-size:13px;color:var(--ink3)}
.gcard textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14.5px;line-height:1.6;min-height:120px;resize:vertical;outline:0}
.gcard textarea:focus{border-color:var(--cobalt)}
.gintro{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px;color:var(--ink2);font-size:14.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.gintro p{margin:0;flex:1;min-width:240px}
.gintro b{color:var(--ink)}
.gsave{border:0;background:var(--cobalt);color:#fff;border-radius:10px;padding:11px 18px;font-weight:800;font-size:15px;white-space:nowrap}
.gsave:disabled{opacity:.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;z-index:50}

.row{grid-template-columns:minmax(180px,1.3fr) minmax(150px,1fr) minmax(150px,1fr) 92px minmax(240px,auto)}
.ps{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.ps .t{font-size:13px}
.ps .tn{font-size:13.5px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.detail{grid-template-columns:1fr 1fr;gap:14px 26px}
.detail .dcol{min-width:0}
.detail h3{margin:0 0 8px;font-size:15px}
.detail h3 small{font-weight:500;color:var(--ink3);margin-left:6px}
.detail .blk{margin-bottom:10px}
.detail dl{display:grid;grid-template-columns:minmax(90px,130px) 1fr;gap:3px 12px;margin:0;font-size:14px}
.detail dt{color:var(--ink3)}
.detail dd{margin:0;font-weight:600}
.detail .miss{color:var(--warn);font-weight:600}
.detail table{border-collapse:collapse;width:100%;font-size:13.5px}
.detail th,.detail td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.detail th{color:var(--ink3);font-weight:600;font-size:12.5px}
.sh{font-size:19px;margin:6px 0 12px;letter-spacing:-.02em}
.sh small{font-size:13.5px;font-weight:500;color:var(--ink3);margin-left:8px}
.stats + .sh{margin-top:28px}
.sc .qh{font-size:13.5px;font-weight:700;color:var(--ink2);margin:12px 0 6px}
.sc .qh:first-of-type{margin-top:0}
.modal{position:fixed;inset:0;z-index:60;background:rgba(14,19,34,.45);display:grid;place-items:center;padding:16px}
.mcard{width:100%;max-width:440px;background:var(--paper);border-radius:16px;padding:22px 22px 18px;border:1px solid var(--line)}
.mcard h2{margin:0 0 8px;font-size:19px}
.mcard p{margin:0 0 12px;color:var(--ink2);font-size:14.5px;white-space:pre-line}
.mcard .code{font-size:20px;font-weight:800;letter-spacing:.04em;background:#f4f5f8;border-radius:10px;padding:12px 14px;margin-bottom:12px;user-select:all;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mact{display:flex;gap:8px;justify-content:flex-end}
.mact button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 16px;font-weight:700}
.mact .ok{background:var(--ink);border-color:var(--ink);color:#fff}
.mact .ok.danger{background:var(--bad);border-color:var(--bad)}

@media (max-width:900px){
  .row.h{display:none}
  .row{grid-template-columns:1fr 1fr;row-gap:8px}
  .row > .nm{grid-column:1/-1}
  .row > .c-upd{grid-column:1/-1;font-size:13px}
  .row > .c-upd::before{content:"최근 저장 ";color:var(--ink3)}
  .acts{grid-column:1/-1;justify-content:flex-start}
  .detail{grid-template-columns:1fr}
  .share{margin-left:0;width:100%}.share input{flex:1;width:auto}
  .top{padding:10px 16px}.wrap{padding:16px 16px 50px}
}
</style>
</head>
<body>

<!-- 로그인 -->
<section class="login" id="loginView" hidden>
  <form class="lcard" id="loginForm">
    <h1>관리자 로그인</h1>
    <p>Supabase에 만들어 둔 관리자 계정으로 로그인하세요.</p>
    <div class="msg bad" id="loginErr" hidden></div>
    <div class="fld"><label for="em">이메일</label><input id="em" type="email" autocomplete="username" required></div>
    <div class="fld"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="pbtn" id="loginBtn">로그인</button>
  </form>
</section>

<!-- 관리자 화면 -->
<div id="appView" hidden>
  <header class="top">
    <div class="brand">그라운드 룰<span>관리자</span></div>
    <div class="sp"></div>
    <span class="who" id="who"></span>
    <button class="tbtn" id="btnReload">새로고침</button>
    <button class="tbtn dark" id="btnCsv">엑셀(CSV) 내려받기</button>
    <button class="tbtn" id="btnLogout">로그아웃</button>
  </header>
  <main class="wrap">
    <div class="head">
      <div><h1>작성 현황</h1><div class="sum" id="sum">불러오는 중…</div></div>
      <div class="share"><b>리더님께 보낼 링크</b><input id="shareUrl" readonly aria-label="작성 링크"><button id="btnShare">복사</button></div>
    </div>
    <div class="msg bad" id="appErr" hidden></div>
    <div class="tabs" role="tablist"><button data-tab="list" class="on">목록</button><button data-tab="stats">많이 고른 내용 (작성 완료 기준)</button><button data-tab="guide">전사 가이드라인</button></div>
    <section id="tabList">
      <div class="bar"><input id="q" placeholder="이름·부서·팀·이메일로 찾기" aria-label="찾기">
        <select id="fs" aria-label="상태로 거르기"><option value="">모든 상태</option>
          <optgroup label="리더 소개"><option value="leader|작성 완료">리더 소개 · 작성 완료</option><option value="leader|완료 후 수정 중">리더 소개 · 완료 후 수정 중</option><option value="leader|작성 중">리더 소개 · 작성 중</option><option value="leader|작성 전">리더 소개 · 작성 전</option></optgroup>
          <optgroup label="우리 팀 규칙"><option value="team|작성 완료">팀 규칙 · 작성 완료</option><option value="team|완료 후 수정 중">팀 규칙 · 완료 후 수정 중</option><option value="team|작성 중">팀 규칙 · 작성 중</option><option value="team|작성 전">팀 규칙 · 작성 전</option></optgroup>
        </select>
        <span class="cnt" id="cnt"></span></div>
      <div id="list"></div>
    </section>
    <section id="tabStats" hidden><div id="stats"></div></section>
    <section id="tabGuide" hidden>
      <div class="gintro"><p>여기 적은 내용은 리더님들이 <b>리더 소개</b>를 쓸 때 해당 단계 맨 위에 <b>“모든 리더 공통 기준”</b>으로 보여요. 리더님들은 이 기준 안에서 자기 방식을 고르게 됩니다. <b>한 줄에 하나씩</b> 적고, 비워 두면 그 단계에는 표시되지 않아요.</p>
        <button class="gsave" id="btnGuideSave">가이드라인 저장</button></div>
      <div class="gform" id="gform"></div>
    </section>
  </main>
</div>

<div class="modal" id="dlg" hidden><div class="mcard" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <h2 id="dlgT"></h2><p id="dlgP"></p><div class="code" id="dlgCode" hidden></div>
  <div class="mact"><button id="dlgNo">취소</button><button class="ok" id="dlgOk">확인</button></div>
</div></div>

<script>
const CFG = window.GR_CONFIG || {};
const BASE = (CFG.supabaseUrl||"").replace(/\/+$/,"");
const LSECS = [["report","보고"],["meeting","회의"],["comm","연락"],["delegate","위임"],["promise","약속"],["feedback","피드백·1on1"],["me","나에 대해"]];
const ASK = ["report","meeting","comm","delegate","feedback"];
const PNAME = {leader:"리더 소개", team:"우리 팀 규칙"};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const str = v => v==null ? "" : String(v);
const fmt = iso => { const d = new Date(iso); return isNaN(d) ? "" : `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const toast = t => { const el = document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), 2200); };
const leaderUrl = () => { try { return new URL("index.html", location.href).href.replace(/index\.html$/, ""); } catch(e){ return location.href.replace(/admin\.html.*$/, ""); } };

/* 확인 창 (브라우저 기본 창 대신) */
function dlg({title, text="", code="", ok="확인", cancel="취소", danger=false}){
  return new Promise(res=>{
    $("#dlgT").textContent = title; $("#dlgP").textContent = text; $("#dlgP").hidden = !text;
    $("#dlgCode").hidden = !code; $("#dlgCode").textContent = code;
    $("#dlgOk").textContent = ok; $("#dlgOk").className = "ok" + (danger ? " danger" : "");
    $("#dlgNo").hidden = !cancel; $("#dlgNo").textContent = cancel || "";
    $("#dlg").hidden = false; $("#dlgOk").focus();
    const done = v => { $("#dlg").hidden = true; $("#dlgOk").onclick = $("#dlgNo").onclick = null; document.removeEventListener("keydown", key); res(v); };
    const key = e => { if(e.key==="Escape") done(false); };
    $("#dlgOk").onclick = () => done(true); $("#dlgNo").onclick = () => done(false);
    document.addEventListener("keydown", key);
  });
}

let session = null, rows = [], openId = null;
try { session = JSON.parse(sessionStorage.getItem("gr_admin")||"null"); } catch(e){}
if(session && session.exp < Date.now()) session = null;

function headers(json){
  const h = {"apikey": CFG.supabaseKey};
  if(session) h.Authorization = "Bearer " + session.token;
  else if(/^eyJ/.test(CFG.supabaseKey||"")) h.Authorization = "Bearer " + CFG.supabaseKey;
  if(json) h["Content-Type"] = "application/json";
  return h;
}
async function api(path, opt={}){
  let r;
  try { r = await fetch(BASE + path, opt); } catch(e){ throw new Error("서버에 연결하지 못했어요. 인터넷 연결을 확인하거나, Supabase 프로젝트가 일시정지(Paused) 상태인지 확인하세요."); }
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch(e){}
  if(r.status===401 || r.status===403){ const e = new Error("auth"); e.detail = j; throw e; }
  if(!r.ok) throw new Error((j && (j.msg || j.message || j.error_description)) || ("HTTP " + r.status));
  return j;
}
const rpc = (fn, body) => api("/rest/v1/rpc/" + fn, {method:"POST", headers: headers(true), body: JSON.stringify(body||{})});
const expired = () => { session = null; sessionStorage.removeItem("gr_admin"); showLogin("로그인이 만료됐어요. 다시 로그인해 주세요."); };

/* ===== 로그인 ===== */
function showLogin(msg){
  $("#appView").hidden = true; $("#loginView").hidden = false;
  const e = $("#loginErr"); e.hidden = !msg; e.textContent = msg||"";
  if(!BASE || /YOUR/.test(BASE+CFG.supabaseKey)){ e.hidden = false; e.textContent = "config.js에 Supabase 주소와 키가 아직 없어요. 설치 안내 4단계를 먼저 해주세요."; }
}
$("#loginForm").addEventListener("submit", async ev=>{
  ev.preventDefault();
  const b = $("#loginBtn"); b.disabled = true; b.textContent = "로그인 중…";
  try {
    const j = await api("/auth/v1/token?grant_type=password", {method:"POST", headers:{"apikey":CFG.supabaseKey, "Content-Type":"application/json"},
      body: JSON.stringify({email: $("#em").value.trim(), password: $("#pw").value})});
    session = {token: j.access_token, email: (j.user && j.user.email) || $("#em").value.trim(), exp: Date.now() + (j.expires_in||3600)*1000 - 60000};
    sessionStorage.setItem("gr_admin", JSON.stringify(session));
    $("#pw").value = ""; start();
  } catch(e){

const canon = v => JSON.stringify(v===undefined ? null : v, (k,x)=> x && typeof x==="object" && !Array.isArray(x) ? Object.keys(x).sort().reduce((o,kk)=>(o[kk]=x[kk],o),{}) : x);
const dataPart = (r,p) => (r.data && r.data.v===4 && r.data[p] && typeof r.data[p]==="object") ? r.data[p] : null;
const subPart = (r,p) => (r.submitted && r.submitted[p] && r.submitted[p].data) || null;
const subAt = (r,p) => (r.submitted && r.submitted[p] && r.submitted[p].at) || "";

const lItems = (d,k) => ((d && d.picks && d.picks[k]) || []).filter(i=>i && str(i.text).trim());
const tRows = d => (d && Array.isArray(d._rows)) ? d._rows : [];
function emptyPart(p, d){
  if(!d) return true;
  const nm = !!(d.info && str(d.info.name).trim());
  if(p==="leader") return !nm && !LSECS.some(([k])=>lItems(d,k).length);
  return !nm && !tRows(d).some(x=>x[2]) && !(d.rnr||[]).length && !(d.flex||[]).length && !(d.topics||[]).length && !str(d.extra).trim();
}
function pstatus(r,p){
  const s = subPart(r,p), d = dataPart(r,p);
  if(!s) return emptyPart(p,d) ? ["작성 전","s-none"] : ["작성 중","s-draft"];
  return canon(d)===canon(s) ? ["작성 완료","s-done"] : ["완료 후 수정 중","s-edit"];
}
const teamName = r => { const d = docPart(r,"team"); return (d && d.info && str(d.info.name).trim()) || ""; };
function balance(d){
  const asks = ASK.reduce((a,k)=>a+lItems(d,k).length,0), prom = lItems(d,"promise").length, need = asks<=3 ? 1 : asks<=7 ? 2 : 3;
  return {asks, prom, ok: asks===0 || prom>=need};
}

const bars = (entries, max) => entries.map(([lb,n])=>`<div class="sb" title="${esc(lb)}"><span class="lb">${esc(lb)}</span><span class="n">${n}</span><span class="tr"><i style="width:${n/Math.max(1,max)*100}%"></i></span></div>`).join("");
function renderStats(){

      const m = new Map(); let own = 0, people = 0;
      ls.forEach(d=>{ const its = lItems(d,k); if(its.length) people++; its.forEach(i=>{ if(i.src){ const kw = str(i.kw)||i.src; m.set(kw, (m.get(kw)||0)+1); } else own++; }); });
      const top = [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6);

      <section class="sc"><h3>R&R</h3><div class="sub">작성 완료한 팀 기준</div>

function csv(){
  const q = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const TQ = []; rows.forEach(r=>tRows(docPart(r,"team")).forEach(([g,s])=>{ const k = g + ": " + s; if(!TQ.includes(k)) TQ.push(k); }));
  const head = ["이름","직책","부서","이메일","리더 소개 상태","리더 소개 완료일","리더 소개 내용 기준","일하는 철학", ...LSECS.map(s=>s[1]),
    "우리 팀 규칙 상태","팀 이름","팀 규칙 완료일","팀 규칙 내용 기준", ...TQ, "R&R (업무 | 주기 | 마감 | 담당 → 대체자)","시차출퇴근","직접 추가한 주제","우리 팀 한 줄","최근 저장"];
  const lines = [head.map(q).join(",")].concat(rows.map(r=>{
    const L = docPart(r,"leader") || {}, T = docPart(r,"team") || {}, tm = {};
    tRows(T).forEach(([g,s,v])=>{ tm[g + ": " + s] = v || "미정"; });
    return [r.name, r.title, r.dept, r.email,
      pstatus(r,"leader")[0], fmt(subAt(r,"leader")), subPart(r,"leader") ? "완료본" : "작성 중", (L.info && L.info.intro) || "",
      ...LSECS.map(([k])=>lItems(L,k).map(i=>str(i.text).trim() + (str(i.reason).trim() ? ` (이유: ${str(i.reason).trim()})` : "")).join("\n")),
      pstatus(r,"team")[0], teamName(r), fmt(subAt(r,"team")), subPart(r,"team") ? "완료본" : "작성 중",
      ...TQ.map(k=>tm[k] || ""),
      (T.rnr||[]).filter(x=>str(x.task).trim()).map(x=>`${x.task} | ${x.cycle} | ${x.due||"-"} | ${x.owner||"미정"} → ${x.sub||"미정"}`).join("\n"),
      (T.flex||[]).filter(x=>str(x.name).trim()).map(x=>`${x.name} ${x.in}~${x.out}`).join("\n"),
      (T.topics||[]).filter(x=>str(x.title).trim()).map(x=>`${x.title}: ${x.note||"미정"}`).join("\n"),
      T.extra || "", fmt(r.updated_at)].map(q).join(",");
  }));
  const blob = new Blob(["﻿" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  const d = new Date(); a.download = `그라운드룰_작성현황_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

  if(guidesLoaded) return;
  try { const g = await rpc("gr_guides", {}) || {}; GKEYS.forEach(([k])=>{ $("#g-"+k).value = (g[k]||[]).join("\n"); }); guidesLoaded = true; }
  catch(e){ if(e.message==="auth"){ expired(); return; } toast("가이드라인을 불러오지 못했어요"); }
}
$("#btnGuideSave").addEventListener("click", async ()=>{
  const g = {}; GKEYS.forEach(([k])=>{ const v = $("#g-"+k).value.split("\n").map(x=>x.trim()).filter(Boolean).slice(0,12).map(x=>x.slice(0,200)); if(v.length) g[k] = v; });
  const b = $("#btnGuideSave"); b.disabled = true; b.textContent = "저장하는 중…";
  try { await rpc("gr_admin_set_guides", {p_guides: g}); toast("저장했어요. 리더님들이 다음에 화면을 열면 보여요."); }
  catch(e){ if(e.message==="auth") expired(); else dlg({title:"저장하지 못했어요", text:e.message, ok:"닫기", cancel:""}); }
  b.disabled = false; b.textContent = "가이드라인 저장";
});
function copy(text){ (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).catch(()=>{ const i=document.createElement("textarea"); i.value=text; document.body.appendChild(i); i.select(); try { document.execCommand("copy"); } catch(e){} i.remove(); }); }
$("#q").addEventListener("input", renderList);
$("#fs").addEventListener("change", renderList);
$("#btnReload").addEventListener("click", load);
$("#btnCsv").addEventListener("click", ()=>{ if(!rows.length){ toast("내려받을 내용이 없어요"); return; } csv(); });
$("#btnShare").addEventListener("click", ()=>{ copy($("#shareUrl").value); toast("작성 링크를 복사했어요"); });

function start(){
  $("#loginView").hidden = true; $("#appView").hidden = false;
  $("#who").textContent = session.email || "";
  $("#shareUrl").value = leaderUrl();
  load();
}
session ? start() : showLogin();
</script>
